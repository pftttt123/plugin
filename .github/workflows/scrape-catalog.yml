name: Scrape netcarshow catalog

on:
  workflow_dispatch:
  push:
    branches:
      - claude/car-spotter-android-app-xm2tqs
    paths:
      - "car-spotter/tools/scrape_netcarshow.py"
      - ".github/workflows/scrape-catalog.yml"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/car-spotter-android-app-xm2tqs

      - name: Probe Wikimedia UA policy (diagnostics)
        continue-on-error: true
        run: |
          URL="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fb/2025_Acura_ADX_A-Spec%2C_front_7.19.25.jpg/960px-2025_Acura_ADX_A-Spec%2C_front_7.19.25.jpg"
          for UA in "okhttp/4.12.0" "CarSpotter/1.1 (Android; +https://github.com/pftttt123/plugin)"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -A "$UA" "$URL")
            echo "UA '$UA' -> HTTP $code"
          done

      - name: Scrape catalog and resolve photos
        run: |
          python3 -m pip install --quiet requests
          python3 car-spotter/tools/scrape_netcarshow.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add car-spotter/app/src/main/assets/cars.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Expand car database with netcarshow.com catalog"
            git push
          fi
